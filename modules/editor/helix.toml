theme = "gruvbox"

[editor]
auto-format = true
auto-pairs = true
auto-save = false
completion-trigger-len = 1
cursorline = true
end-of-line-diagnostics = "hint"
jump-label-alphabet = "shtarenicpdoluwfmxbgyzvk"
line-number = "relative"
middle-click-paste = false
mouse = false
rulers = [88]
text-width = 88
true-color = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
center = ["diagnostics", "workspace-diagnostics"]
left = ["mode", "spinner", "file-name", "file-modification-indicator", "file-type", "total-line-numbers", "file-encoding"]
right = ["selections", "primary-selection-length", "position", "position-percentage"]

[editor.file-picker]
hidden = false

[editor.whitespace.render]
nbsp = "all"
newline = "none"
space = "none"
tab = "all"

[editor.whitespace.characters]
nbsp = "⍽"
newline = "⏎"
space = "·"
tab = "→"
tabpad = " "

[editor.indent-guides]
character = "▏"
render = true
skip-levels = 0

[editor.soft-wrap]
enable = true
max-indent-retain = 40
max-wrap = 20
wrap-at-text-width = false
wrap-indicator = "↪"

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

down = "move_line_down"
up = "move_line_up"
G = "goto_last_line"

h = "goto_word"

A-F = "extend_prev_char"
A-f = "find_prev_char"
A-T = "extend_till_prev_char"
A-t = "till_prev_char"
B = "extend_prev_word_start"
E = "extend_next_word_end"
F = "extend_next_char"
T = "extend_till_char"
W = "extend_next_word_start"
X = "extend_line_above"
A-x = "extend_line_up"
A-X = "extend_line_down"

Y = ":yank-join"
C-y = ':! echo -e "\e]52;;$(echo -n %{buffer_name} | base64)\007" > /dev/tty'

[keys.normal.g]
h = ["collapse_selection", "extend_to_line_start"]
H = ["extend_to_line_start"]
e = ["collapse_selection", "extend_to_line_end"]
E = ["extend_to_line_end"]
s = ["collapse_selection", "extend_to_first_nonwhitespace"]
S = ["extend_to_first_nonwhitespace"]

[keys.normal.m]
m = ["collapse_selection", "select_mode", "match_brackets", "exit_select_mode"]
'"' = '@f"<right>mi"'
"'" = "@f'<right>mi'"
"(" = "@f)<left>mi)"
"[" = "@f]<left>mi]"
"{" = "@f}<left>mi}"

[keys.normal.space]
space = "flip_selections"
B = ":sh git log -n 5 --format='format:%%h (%%an: %%ar) %%s' --no-patch -L%{cursor_line},+1:%{buffer_name}"

[keys.normal.z]
c = ":set gutters.line-numbers.min-width 75"
C = ":set gutters.line-numbers.min-width 3"
